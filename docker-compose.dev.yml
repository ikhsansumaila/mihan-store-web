# Pengembangan (hot reload). Memakai .env yang sama dengan produksi.
# Untuk dev lokal tanpa Turnstile boleh set ALLOW_NO_TURNSTILE=true di .env — JANGAN di produksi.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mihanstore_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST:-mysql_db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mihanstore}
      - DB_USER=${DB_USER:-mihanstore_app}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-168}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://store.mihan.web.id,https://mihankids.my.id}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - ALLOW_NO_TURNSTILE=${ALLOW_NO_TURNSTILE:-false}
    volumes:
      - ./backend:/app
    networks:
      mihanstore-net: {}
      nginx-proxy-manager-network:
        # IP tetap: NPM (location /api -> mihanstore_backend:8080) me-resolve nama
        # backend hanya saat NPM start/reload. Tanpa IP tetap, recreate backend
        # membuat /api 502 sampai NPM di-reload.
        ipv4_address: 172.22.0.7
      mysql-net: {}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mihanstore_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
      - WDS_SOCKET_PORT=0
      - REACT_APP_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mihanstore-net
      - nginx-proxy-manager-network

networks:
  mihanstore-net:
    driver: bridge
  nginx-proxy-manager-network:
    external: true
  mysql-net:
    external: true
