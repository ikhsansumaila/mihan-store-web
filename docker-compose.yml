services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mihanstore_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    networks:
      - mihanstore-net
      - nginx-proxy-manager-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mihanstore_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
      - REACT_APP_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
    networks:
      - mihanstore-net
      - nginx-proxy-manager-network

networks:
  mihanstore-net:
    driver: bridge
  nginx-proxy-manager-network:
    external: true
