# Produksi. Rahasia dibaca dari file .env di folder ini (tidak di-commit; lihat .env.example).
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mihanstore_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST:-mysql_db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mihanstore}
      - DB_USER=${DB_USER:-mihanstore_app}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-168}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://store.mihan.web.id,https://mihankids.my.id}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Admin lewat Cloudflare Access (kosong = /api/admin/* menjawab 503, fail-closed)
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD_STORE=${CF_ACCESS_AUD_STORE:-}
      # Login Google pelanggan (kosong = /api/auth/google* menjawab 503)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - AUTH_HMAC_SECRET=${AUTH_HMAC_SECRET:-}
      # Notifikasi pesanan ke Discord (rahasia; kosong = nonaktif, backend tetap jalan)
      - DISCORD_ORDER_WEBHOOK_URL=${DISCORD_ORDER_WEBHOOK_URL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://store.mihan.web.id}
    networks:
      mihanstore-net: {}
      nginx-proxy-manager-network:
        # IP tetap: NPM (location /api -> mihanstore_backend:8080) me-resolve nama
        # backend hanya saat NPM start/reload. Tanpa IP tetap, recreate backend
        # membuat /api 502 sampai NPM di-reload.
        ipv4_address: 172.22.0.7
      mysql-net: {}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    container_name: mihanstore_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mihanstore-net
      - nginx-proxy-manager-network

networks:
  mihanstore-net:
    driver: bridge
  nginx-proxy-manager-network:
    external: true
  mysql-net:
    external: true
