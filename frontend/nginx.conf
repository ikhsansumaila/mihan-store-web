server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aset build ber-hash boleh di-cache lama
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Path mentah (sebelum dinormalkan nginx) berisi segmen "..", titik/garis miring ter-encode, atau
    # garis miring terbalik -> 404 (mis. /uploads/../etc/passwd, /uploads/%2e%2e/...). Query string tidak diperiksa.
    if ($request_uri ~* "^[^?]*(/\.\.|\.\./|%2e|%2f|%5c|\x5c)") {
        return 404 "Tidak ditemukan\n";
    }

    # ---- Foto produk (berkas di disk VPS, di-mount READ-ONLY ke /usr/share/nginx/uploads) ----
    # Hanya pola kunci yang dibuat backend yang disajikan: /uploads/products/<id>/<uuid v4>[_t].jpg.
    # Tanpa daftar direktori, tanpa eksekusi apa pun; selain pola sah -> 404.
    # Penamaan unik per unggahan (UUID) -> aman di-cache lama (Cloudflare & browser).
    location ~ "^/uploads/(products/[0-9]{1,20}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:_t)?\.jpg)$" {
        alias /usr/share/nginx/uploads/$1;
        autoindex off;
        limit_except GET HEAD { deny all; }
        default_type image/jpeg;
        types { image/jpeg jpg; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @uploads_404;
        error_page 403 = @uploads_404;
        log_not_found off;
    }
    # Semua path /uploads lain (daftar direktori, traversal, berkas tidak sah) -> 404.
    location = /uploads {
        types { }
        default_type text/plain;
        return 404 "Tidak ditemukan\n";
    }
    location /uploads/ {
        types { }
        default_type text/plain;
        return 404 "Tidak ditemukan\n";
    }
    location @uploads_404 {
        types { }
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 404 "Tidak ditemukan\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Di produksi /api dirutekan NPM langsung ke mihanstore_backend:8080.
    # Blok ini hanya cadangan bila frontend diakses langsung.
    location /api {
        # Resolusi DNS saat request (bukan saat start) agar frontend tetap jalan
        # walau backend sedang di-recreate.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /index.html;
}
